# Builds the release artifacts and publishes the Homebrew cask.
#
# Why goreleaser, in a repo that otherwise hand-writes its CI: the cask goes to
# Allan-Nava/homebrew-tap, and that tap's rule (INTENT.md, HT-12) is "no formula, only casks, and
# nobody writes one by hand". Four of its five casks are goreleaser output, and its `brew style`
# exclusions key off the `generated by GoReleaser` marker — a hand-rolled cask would land in the
# strict bucket and fail on a template nobody here can fix. Fitting the tap is worth one CI tool.
#
# The release NOTES are still taken from CHANGELOG.md by release.yml and passed with
# --release-notes: `use: github` would let the announcement disagree with the file.
version: 2

project_name: robotsmith

builds:
  - id: robotsmith
    main: .
    binary: robotsmith
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # ⚠️ `v{{ .Version }}`, with the v: goreleaser strips it from the tag, and `robotsmith version`
    # has always printed the tag as written. Dropping it would silently change documented output.
    ldflags:
      - -s -w -X main.version=v{{ .Version }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - name: robotsmith
    repository:
      owner: Allan-Nava
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/Allan-Nava/robotsmith"
    description: "Verifies a robots.txt and advises how to write it from your real traffic"
    # ⚠️ The binary is not signed or notarised. Without stripping the quarantine attribute a CLI
    # does not get the "unidentified developer" dialog a GUI gets — it dies on SIGKILL, exit 137,
    # with NO output, and whoever hits it reports the wrong bug.
    hooks:
      post:
        install: |
          if system_command "/usr/bin/xattr", args: ["-h"], print_stderr: false
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/robotsmith"]
          end
    # "auto" = publish on a normal tag, skip on a prerelease. Without it a v1.0.0-rc.1 would become
    # what `brew install` hands every user — the opposite of what a release candidate is for.
    skip_upload: "auto"

release:
  draft: false
  prerelease: auto

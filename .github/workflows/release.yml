# Cuts a release from a tag: cross-compiled archives, checksums, release notes taken from the
# CHANGELOG so the announcement cannot disagree with the file, and the Homebrew cask pushed to
# Allan-Nava/homebrew-tap. Nothing here runs on a branch push — a release is always a deliberate
# `git tag` + `git push --follow-tags` by the maintainer.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the build stamps the commit; a shallow clone has no vcs info
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # A red suite must never become a release: the tag is what `go install` consumers get.
      - run: go test -race ./...

      # ⚠️ Kept out of goreleaser's `changelog:` on purpose. `use: github` would build the notes
      # from commit subjects, which is a second source of truth next to CHANGELOG.md — and a
      # missing section would then go unnoticed instead of stopping the release.
      - name: Release notes from the CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { p = 1; next }
            p && /^## \[/          { exit }
            p                      { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section — write it before tagging."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          # ⚠️ `${{ }}`, not `${}`: a `with:` value is read by the Actions expression engine, not
          # by a shell, so `${RUNNER_TEMP}` reaches goreleaser as a literal path and the release
          # dies after building every binary. Guarded by TestWorkflowInputsDoNotUseShellVariables.
          args: release --clean --release-notes "${{ runner.temp }}/notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ⚠️ A PAT with write access to Allan-Nava/homebrew-tap — the default GITHUB_TOKEN cannot
          # write to another repository. Without this secret the release publishes archives and
          # then dies on the last step, and the tap silently keeps serving the previous version.
          # That is exactly the failure brew.yml compares against releases/latest to catch.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # The moving major tag an action consumer expects: `uses: Allan-Nava/robotsmith@v0` keeps
      # working across releases, and the documents advertise exactly this.
      # ⚠️ It runs LAST and only on a release that got this far. A major tag moved onto a release
      # that failed to publish would point every consumer at assets that do not exist — and it is
      # force-moved, because a tag that is only ever created stays frozen on the release it was cut
      # at while looking perfectly maintained, which is worse than not having one.
      # ⚠️ Never for a prerelease: `v0` must mean the newest STABLE release.
      - name: Move the major tag
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          major="${TAG%%.*}"                 # v0.5.1 -> v0
          if [ "$major" = "$TAG" ]; then
            echo "::error::$TAG is not vX.Y.Z, refusing to guess a major tag"; exit 1
          fi
          git tag -f "$major" "$TAG"
          git push -f origin "refs/tags/$major"
          echo "::notice::$major now points at $TAG"

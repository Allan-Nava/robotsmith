# Cuts a release from a tag: cross-compiled binaries, checksums, and release notes taken from the
# CHANGELOG so the announcement cannot disagree with the file. Nothing here runs on a branch push —
# a release is always a deliberate `git tag` + `git push --tags` by the maintainer.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the build stamps the commit; a shallow clone has no vcs info
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # A red suite must never become a release: the tag is what `go install` consumers get.
      - run: go test -race ./...

      - name: Release notes from the CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { p = 1; next }
            p && /^## \[/          { exit }
            p                      { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section — write it before tagging."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build every target
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/robotsmith_${VERSION}_${os}_${arch}" .
          done
          cd dist && sha256sum * > checksums.txt && cat checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "robotsmith $GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/*

      # The formula points at the source tarball GitHub generates for the tag. Its checksum only
      # exists once the tag does, so it is filled in here — a formula updated by hand goes stale
      # after the first release nobody remembers to edit.
      - name: Update the Homebrew formula
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          SHA="$(curl -fsSL "$URL" | sha256sum | cut -d" " -f1)"
          sed -i -E "s#^(  url \").*(\")#\1${URL}\2#" Formula/robotsmith.rb
          sed -i -E "s#^(  sha256 \").*(\")#\1${SHA}\2#" Formula/robotsmith.rb
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/robotsmith.rb
          if git diff --cached --quiet; then
            echo "formula already current"; exit 0
          fi
          git commit -m "brew: robotsmith ${TAG}"
          git push origin HEAD:main

  # The formula the job above just wrote, installed on macOS exactly as a user would. It runs
  # against `main`, not against the tag: the tag's tree still carries the previous url/sha256.
  # A failure here does not un-publish the release — the binaries and the notes are already out —
  # it tells the maintainer that `brew install` is broken before anyone reports it.
  brew:
    needs: release
    uses: ./.github/workflows/brew.yml
    with:
      ref: main

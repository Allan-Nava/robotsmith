# Publishes the container image to GHCR. On a pull request the image is only BUILT — a broken
# Dockerfile then costs a red check instead of a failed release.
name: docker
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['Dockerfile', '.dockerignore', '**.go', 'go.mod', '.github/workflows/docker.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3     # arm64 without an arm64 runner
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # a tag gets its version and `latest`; main gets `edge`, so nobody pulls a branch by accident
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image claims to be a CLI: prove it runs and that the exit-code contract survives the
      # trip through a scratch image (no shell in there, so this is the only smoke test available).
      - name: Smoke-test the image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE="$(echo '${{ steps.meta.outputs.tags }}' | head -1)"
          docker run --rm "$IMAGE" version
          printf 'User-agent: *\nDisallow: /admin/\n' > robots.txt
          docker run --rm -v "$PWD:/w:ro" "$IMAGE" lint /w/robots.txt

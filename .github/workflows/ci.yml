name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      # The release builds four targets; catching a platform-specific break here costs seconds,
      # catching it during a release costs a retracted tag.
      - name: Cross-compile the release targets
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null .
          done
      # The action is dogfooded here on purpose: a mistake in action.yml is a red check in this
      # repo before it is a red check for a stranger. It runs TWICE, against two different
      # binaries, because the two failures it can catch are not the same failure.
      - name: Build the binary the action will run
        run: go build -o "$RUNNER_TEMP/robotsmith" .

      # Blocking: action.yml against THIS branch's code. ⚠️ It must not be `version: latest`.
      # That pins the check to whatever was last PUBLISHED, so the day this branch starts passing a
      # flag the published binary does not know, ci goes red for something no commit here can fix —
      # which is what happened between 0.4.0 and 0.5.1: six consecutive red runs nobody acted on,
      # because releases/latest was 0.2.0 and `--format` had not shipped yet.
      - name: Our own action, on our own robots.txt
        uses: ./
        with:
          command: lint
          target: docs/robots.txt
          args: --strict
          binary: ${{ runner.temp }}/robotsmith

      - name: Coverage summary
        run: go test -coverprofile=cover.out ./... >/dev/null && go tool cover -func=cover.out | tail -1

  # The INSTALL path — asset discovery and checksum verification — against the real release, using
  # `@v0`: the reference the README tells strangers to copy. Running `./` here instead is exactly
  # how `@v1` stayed advertised and non-existent, because the repo never once ran what it
  # recommends.
  #
  # ⚠️ Its OWN job, and this is not tidiness. GitHub resolves every `uses:` during "Prepare all
  # required actions", before a single step runs, so a reference that does not resolve fails the
  # job at setup and `continue-on-error` on the step never gets a chance to apply. As a step inside
  # `test` it took the branch-protection required check down with it and nothing could merge.
  # Guarded by TestTheRequiredJobDoesNotDependOnOurOwnPublishedAction.
  #
  # ⚠️ Gated on the tag EXISTING, in a separate job, and that is the second half of the same
  # lesson. Actions are resolved at job setup, so a step-level `if:` does not prevent the
  # resolution failure — only not starting the job at all does. Without this gate the job is red
  # from now until the first release moves `v0`, which is a red nobody can act on, and this repo
  # holds that such a red teaches people to ignore red (see CLAUDE.md, Automation).
  # Skipped is the honest state before the first release; red afterwards means something to fix.
  advertised-tag:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.q.outputs.exists }}
    steps:
      - id: q
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/v0" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no v0 tag yet — the advertised reference cannot be exercised until a release moves it"
          fi

  advertised:
    needs: advertised-tag
    if: needs.advertised-tag.outputs.exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The reference we advertise, against the published release
        uses: Allan-Nava/robotsmith@v0
        with:
          command: lint
          target: docs/robots.txt
          args: --strict

# Installs the formula the way a user would, on a real macOS runner. The formula is rewritten by a
# robot at tag time (release.yml) and installed by people days later — without this, the first
# person to run `brew install robotsmith` is the one who finds out the tarball checksum is wrong.
name: brew

on:
  pull_request:
    paths: ['Formula/**', '.github/workflows/brew.yml']
  workflow_dispatch:
  # release.yml calls this after committing the new url/sha256: that pair is the one worth proving,
  # not the stale one that was in the tree when the tag was cut.
  workflow_call:
    inputs:
      ref:
        description: 'Commit or branch to take the formula from'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-14          # arm64: what `brew install` actually runs for most people today
    timeout-minutes: 30
    env:
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ENV_HINTS: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      TAP: robotsmith-ci/local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # ⚠️ `brew audit ./Formula/robotsmith.rb` is DISABLED in current Homebrew — it only takes a
      # formula NAME. So the file has to live in a tap, and every command below names it
      # tap-qualified: a bare `robotsmith` would let brew resolve some other formula from its API
      # and the job would go green having installed nothing of ours.
      - name: Put the formula in a throwaway tap
        run: |
          set -euo pipefail
          brew tap-new "$TAP" --no-git
          cp Formula/robotsmith.rb "$(brew --repository "$TAP")/Formula/robotsmith.rb"

      # audit is the gate a `brew tap` applies: bad metadata, a missing licence, a `url` that does
      # not resolve. `--online` is what catches the checksum the release just wrote.
      - name: brew audit
        run: brew audit --strict --online "$TAP/robotsmith"

      # From source, on purpose: the formula ships no bottle, so this is byte for byte the path a
      # user takes. `--verbose` keeps the Go build log in the run when it fails.
      - name: brew install
        run: brew install --build-from-source --verbose "$TAP/robotsmith"

      # The formula's own `test do` block: it asserts `lint` exits 1 on a defect and that `advise`
      # emits a group. Those exit codes are a documented contract (CLAUDE.md, Invariants 7).
      - name: brew test
        run: brew test "$TAP/robotsmith"

      # A last look from outside brew: the binary on PATH must report a version, which is the whole
      # job of `-X main.version=` in the formula. A bare `robotsmith` here is deliberate — this
      # step checks what landed on PATH.
      - name: The installed binary reports its version
        run: |
          set -euo pipefail
          robotsmith version
          robotsmith version | grep -Eq 'v?[0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "::error::the installed binary reports no version — check the ldflags in the formula"; exit 1; }

# robotsmith as a GitHub Action, so adding it to a pipeline is three lines:
#
#   - uses: Allan-Nava/robotsmith@v1
#     with:
#       command: lint
#       target: robots.txt
#
# Composite, not Docker: a Docker action pays an image build or pull on every run, and this is a
# 6 MB static binary. It downloads the release asset for the runner and verifies it against the
# release's own checksums.txt — a CI step that curls an unverified binary and runs it is a supply
# chain nobody audited.
name: robotsmith
description: Verify a robots.txt, or advise one from your traffic, with findings as annotations
author: Allan-Nava
branding:
  icon: shield
  color: orange

inputs:
  command:
    description: 'check | lint | advise | crawlers'
    required: false
    default: lint
  target:
    description: 'What to run it on: a file, a URL or a domain. Not used by `crawlers`.'
    required: false
    default: robots.txt
  args:
    description: 'Extra flags, verbatim (e.g. "--strict", "--sitemaps", "--origin https://origin/robots.txt")'
    required: false
    default: ''
  version:
    description: 'Release to use: a tag like v0.3.0, or "latest"'
    required: false
    default: latest
  format:
    description: 'text | json | github — "github" turns findings into annotations on the offending lines'
    required: false
    default: github
  fail-on-findings:
    description: 'Fail the step when the tool exits non-zero. Set to false to report only.'
    required: false
    default: 'true'

outputs:
  exit-code:
    description: 'The toolexit code: 0 all as it should be, 1 something is not, 2 usage, 4 unreachable'
    value: ${{ steps.run.outputs.exit-code }}
  output:
    description: 'Everything the tool wrote to stdout (the JSON document when format is json)'
    value: ${{ steps.run.outputs.output }}

runs:
  using: composite
  steps:
    - name: Install robotsmith
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$(uname -s)" in
          Linux)  os=linux ;;
          Darwin) os=darwin ;;
          *) echo "::error::robotsmith ships linux and darwin binaries; this runner is $(uname -s)"; exit 1 ;;
        esac
        case "$(uname -m)" in
          x86_64|amd64) arch=amd64 ;;
          arm64|aarch64) arch=arm64 ;;
          *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
        esac

        base="https://github.com/Allan-Nava/robotsmith/releases"
        if [ "$VERSION" = "latest" ]; then
          url="$base/latest/download"
        else
          url="$base/download/$VERSION"
        fi

        tmp="$(mktemp -d)"
        # ⚠️ The asset NAME is discovered, never guessed. It has already changed once (archives to
        # raw binaries, with the version embedded), and a wrong guess is a 404 that nobody sees
        # until somebody runs the action. checksums.txt lists exactly what was published, and we
        # need it for verification anyway.
        curl -fsSL "$url/checksums.txt" -o "$tmp/checksums.txt"

        # Both spellings of each axis, because release tooling disagrees about them
        # (darwin/macos, amd64/x86_64, arm64/aarch64).
        case "$os" in
          linux)  os_re="linux" ;;
          darwin) os_re="darwin|macos|apple" ;;
        esac
        case "$arch" in
          amd64) arch_re="amd64|x86_64|x64" ;;
          arm64) arch_re="arm64|aarch64" ;;
        esac

        asset="$(awk '{print $NF}' "$tmp/checksums.txt" \
          | grep -iE "(^|[._-])($os_re)([._-]|$)" \
          | grep -iE "(^|[._-])($arch_re)([._-]|$)" \
          | head -1)"
        if [ -z "$asset" ]; then
          echo "::error::no $os/$arch asset in this release. Published:"
          awk '{print "  " $NF}' "$tmp/checksums.txt"
          exit 1
        fi
        echo "asset: $asset"

        curl -fsSL "$url/$asset" -o "$tmp/$asset"
        # sha256sum on Linux, shasum on macOS: assuming one of them fails on half the runners.
        if command -v sha256sum >/dev/null 2>&1; then
          ( cd "$tmp" && grep " $asset\$" checksums.txt | sha256sum -c - )
        else
          ( cd "$tmp" && grep " $asset\$" checksums.txt | shasum -a 256 -c - )
        fi

        # An archive or the binary itself: decided by the gzip magic bytes, not by the file name —
        # the same reason `advise --log` sniffs its input.
        if [ "$(head -c 2 "$tmp/$asset" | od -An -tx1 | tr -d ' \n')" = "1f8b" ]; then
          tar -xzf "$tmp/$asset" -C "$tmp"
          bin="$(find "$tmp" -type f -name robotsmith -perm -u+x | head -1)"
        else
          bin="$tmp/$asset"
        fi
        if [ -z "$bin" ] || [ ! -f "$bin" ]; then
          echo "::error::downloaded $asset but found no robotsmith binary in it"; exit 1
        fi
        chmod +x "$bin"
        cp "$bin" "$tmp/bin-robotsmith"
        echo "ROBOTSMITH=$tmp/bin-robotsmith" >> "$GITHUB_ENV"
        "$tmp/bin-robotsmith" version

    - name: Run robotsmith
      id: run
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        TARGET: ${{ inputs.target }}
        ARGS: ${{ inputs.args }}
        FORMAT: ${{ inputs.format }}
        FAIL_ON: ${{ inputs.fail-on-findings }}
      run: |
        set -uo pipefail
        # `crawlers` takes no target; the others do.
        target=("$TARGET")
        if [ "$COMMAND" = "crawlers" ]; then target=(); fi

        set +e
        # shellcheck disable=SC2086 -- ARGS is meant to be word-split: it is a flag list.
        out="$("$ROBOTSMITH" "$COMMAND" "${target[@]}" --format "$FORMAT" $ARGS 2>&1)"
        code=$?
        set -e

        printf '%s\n' "$out"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        {
          echo "output<<ROBOTSMITH_EOF"
          printf '%s\n' "$out"
          echo "ROBOTSMITH_EOF"
        } >> "$GITHUB_OUTPUT"

        # The step summary is where somebody looks after the fact; annotations are for the diff.
        {
          echo "### robotsmith $COMMAND"
          echo '```'
          printf '%s\n' "$out"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$code" -ne 0 ] && [ "$FAIL_ON" != "true" ]; then
          echo "::notice::robotsmith exited $code; fail-on-findings is false, so the step passes"
          exit 0
        fi
        exit "$code"
